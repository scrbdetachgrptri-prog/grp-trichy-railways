<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comparative Statement Of Property Crimes | GRP Trichy Railways</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#17202a;font-family:Arial,"Noto Sans Tamil",sans-serif}
.page{width:100%;height:100vh;margin:0;padding:4px 8px 6px;display:flex;flex-direction:column}
h1{margin:0 0 3px;color:#123b63;font-size:21px;text-align:center;flex:0 0 auto}
.toolbar{display:flex;justify-content:center;gap:8px;margin-bottom:3px;flex:0 0 auto}
.download,.back{display:inline-block;padding:4px 10px;border-radius:5px;text-decoration:none;font-weight:700;font-size:12px}
.download{background:#f2b632;color:#17202a}
.back{background:#fff;color:#123b63;border:1px solid #123b63}
.data-box{width:100%;flex:1;min-height:0;overflow:auto;background:#fff;position:relative;scroll-behavior:smooth}
#tableWrap{transform-origin:top left;height:100%}
table{border-collapse:collapse;table-layout:fixed;width:100%;min-width:1800px;height:auto}
th,td{border:1px solid #cbd5e1;padding:2px 2px;vertical-align:middle;line-height:1.18;font-size:13px;overflow-wrap:anywhere;word-break:break-word;text-align:center}
th{background:#123b63;color:#fff;font-weight:700}
td{background:#fff}
td:first-child{text-align:center;width:7%}
td:nth-child(2){text-align:left;width:25%}
td:nth-child(3){width:20%}
td:nth-child(4){width:35%}
td:nth-child(5){width:13%}
tbody tr{height:1px}.total-count-row td{color:red}
.scroll-controls{position:fixed;right:18px;bottom:18px;display:grid;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px;gap:6px;z-index:20}.scroll-controls button{border:1px solid #123b63;border-radius:7px;background:#123b63;color:#fff;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}.scroll-controls button:hover{background:#1c527f}.scroll-up{grid-column:2;grid-row:1}.scroll-left{grid-column:1;grid-row:2}.scroll-down{grid-column:2;grid-row:2}.scroll-right{grid-column:3;grid-row:2}.status{text-align:center;padding:12px;color:#667085;font-size:12px}
</style>
</head>
<body>
<main class="page">
<h1>Comparative Statement Of Property Crimes</h1>
<div class="toolbar">
<a class="download" href="https://docs.google.com/spreadsheets/d/1IUqf6_cN2KsbyIhVoAlp_or2mBDCSZM8bQcY8Gu4r2g/export?format=pdf&gid=0" download="Comparative-Statement-Of-Property-Crimes.pdf">Download PDF</a>
<a class="back" href="september-review.html">Back</a>
</div>
<div class="data-box" id="dataBox"><div class="status">Loading data...</div></div><div class="scroll-controls" aria-label="Table scroll controls"><button class="scroll-up" type="button" aria-label="Scroll up" onclick="scrollTable(0,-450)">▲</button><button class="scroll-left" type="button" aria-label="Scroll left" onclick="scrollTable(-650,0)">◀</button><button class="scroll-down" type="button" aria-label="Scroll down" onclick="scrollTable(0,450)">▼</button><button class="scroll-right" type="button" aria-label="Scroll right" onclick="scrollTable(650,0)">▶</button></div>
</main>
<script>
const csvUrl='https://docs.google.com/spreadsheets/d/1IUqf6_cN2KsbyIhVoAlp_or2mBDCSZM8bQcY8Gu4r2g/gviz/tq?tqx=out:csv&gid=0';
function parseCSV(text){
 const rows=[];let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];
  if(c==='"'){if(quoted&&n==='"'){cell+='"';i++;}else{quoted=!quoted;}}
  else if(c===','&&!quoted){row.push(cell);cell='';}
  else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(v=>v!==''))rows.push(row);row=[];}
  else cell+=c;
 }
 if(cell!==''||row.length){row.push(cell);if(row.some(v=>v!==''))rows.push(row);}
 return rows;
}
function scrollTable(x,y){document.getElementById("dataBox").scrollBy({left:x,top:y,behavior:"smooth"});}
function fitTable(){
 const box=document.getElementById('dataBox');
 const wrap=document.getElementById('tableWrap');
 if(!wrap)return;
 wrap.style.transform='scale(1)';
 wrap.style.width='100%';
 const bodyRows=wrap.querySelectorAll('tbody tr');
 const header=wrap.querySelector('thead');
 if(bodyRows.length){
  const headerH=header?header.getBoundingClientRect().height:0;
  const rowH=Math.max(42,(box.clientHeight-headerH)/bodyRows.length);
  bodyRows.forEach(r=>r.style.height=rowH+'px');
 }
 wrap.style.transform='scale(1)';
 wrap.style.width='100%';
}
fetch(csvUrl).then(r=>r.text()).then(text=>{
 const rows=parseCSV(text);
 if(!rows.length)throw new Error('No data');
 const wrap=document.createElement('div');wrap.id='tableWrap';
 const table=document.createElement('table');
 const thead=document.createElement('thead'),tr=document.createElement('tr');
 rows[0].forEach(v=>{const th=document.createElement('th');th.textContent=v;tr.appendChild(th);});
 thead.appendChild(tr);table.appendChild(thead);
 const tbody=document.createElement('tbody');
 rows.slice(1).forEach(row=>{
  const tr=document.createElement('tr');
  for(let i=0;i<rows[0].length;i++){const td=document.createElement('td');td.textContent=row[i]||'';tr.appendChild(td);}
  if(row.some(v=>String(v).trim().toLowerCase().includes('total count')))tr.classList.add('total-count-row');
  tbody.appendChild(tr);
 });
 table.appendChild(tbody);wrap.appendChild(table);
 const box=document.getElementById('dataBox');box.innerHTML='';box.appendChild(wrap);
 requestAnimationFrame(fitTable);
 window.addEventListener('resize',fitTable);
}).catch(()=>{document.getElementById('dataBox').innerHTML='<div class="status">Unable to load the connected spreadsheet data.</div>';});
</script>
</body>
</html>
