<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comparative Statement Of Property Crimes | GRP Trichy Railways</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;background:#fff;color:#17202a;font-family:Arial,"Noto Sans Tamil",sans-serif}
.page{width:100%;margin:0;padding:12px 8px 18px}
h1{margin:0 0 10px;color:#123b63;font-size:24px;text-align:center}
.toolbar{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.download,.back{display:inline-block;padding:7px 14px;border-radius:5px;text-decoration:none;font-weight:700;font-size:13px}
.download{background:#f2b632;color:#17202a}
.back{background:#fff;color:#123b63;border:1px solid #123b63}
.data-box{width:100%;overflow:hidden;background:#fff}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid #cbd5e1;padding:5px 6px;vertical-align:middle;line-height:1.15;font-size:11px;overflow-wrap:anywhere;word-break:break-word}
th{background:#123b63;color:#fff;font-weight:700;text-align:center}
td{background:#fff}
td:first-child{text-align:center;width:7%}
td:nth-child(2){text-align:left;width:25%}
.status{text-align:center;padding:18px;color:#667085;font-size:13px}
@media(max-width:900px){
 .page{padding:8px 5px 12px}
 h1{font-size:20px;margin-bottom:8px}
 .toolbar{margin-bottom:8px}
 .download,.back{padding:6px 11px;font-size:12px}
 th,td{padding:4px 4px;font-size:9px;line-height:1.1}
}
</style>
</head>
<body>
<main class="page">
<h1>Comparative Statement Of Property Crimes</h1>
<div class="toolbar">
<a class="download" href="https://docs.google.com/spreadsheets/d/1IUqf6_cN2KsbyIhVoAlp_or2mBDCSZM8bQcY8Gu4r2g/export?format=pdf&gid=0" download="Comparative-Statement-Of-Property-Crimes.pdf">Download PDF</a>
<a class="back" href="september-review.html">Back</a>
</div>
<div class="data-box" id="dataBox"><div class="status">Loading data...</div></div>
</main>
<script>
const csvUrl='https://docs.google.com/spreadsheets/d/1IUqf6_cN2KsbyIhVoAlp_or2mBDCSZM8bQcY8Gu4r2g/gviz/tq?tqx=out:csv&gid=0';
function parseCSV(text){
 const rows=[];let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];
  if(c==='"'){if(quoted&&n==='"'){cell+='"';i++;}else{quoted=!quoted;}}
  else if(c===','&&!quoted){row.push(cell);cell='';}
  else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(v=>v!==''))rows.push(row);row=[];}
  else cell+=c;
 }
 if(cell!==''||row.length){row.push(cell);if(row.some(v=>v!==''))rows.push(row);}
 return rows;
}
fetch(csvUrl).then(r=>r.text()).then(text=>{
 const rows=parseCSV(text);
 if(!rows.length)throw new Error('No data');
 const table=document.createElement('table');
 const thead=document.createElement('thead'),tr=document.createElement('tr');
 rows[0].forEach(v=>{const th=document.createElement('th');th.textContent=v;tr.appendChild(th);});
 thead.appendChild(tr);table.appendChild(thead);
 const tbody=document.createElement('tbody');
 rows.slice(1).forEach(row=>{
  const tr=document.createElement('tr');
  for(let i=0;i<rows[0].length;i++){const td=document.createElement('td');td.textContent=row[i]||'';tr.appendChild(td);}
  tbody.appendChild(tr);
 });
 table.appendChild(tbody);
 const box=document.getElementById('dataBox');box.innerHTML='';box.appendChild(table);
}).catch(()=>{document.getElementById('dataBox').innerHTML='<div class="status">Unable to load the connected spreadsheet data.</div>';});
</script>
</body>
</html>
