<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monthly Review | GRP Trichy Railways</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Tamil",sans-serif;background:#f5f7fa;color:#17202a}
header{background:#123b63;color:#fff;padding:14px 6%;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}
.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;margin:2px 0;opacity:.85}
.back{color:#fff;text-decoration:none;border:1px solid #fff;padding:8px 14px;border-radius:6px}
main{padding:45px 7% 65px}.title{text-align:center;margin-bottom:30px}.title h2{color:#123b63;font-size:32px;margin:0 0 8px}.title p{color:#667085}
.month-folders{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:1000px;margin:0 auto}
.month-folder{border:0;background:#fff;border-radius:10px;padding:0 18px 18px;box-shadow:0 5px 20px #00000012;cursor:pointer;text-align:center;transition:.2s}
.month-folder:hover{transform:translateY(-3px);box-shadow:0 8px 24px #00000018}
.folder-tab{height:12px;width:55%;margin-left:0;border-radius:8px 8px 0 0;background:#f2b632}
.folder-icon{font-size:42px;margin-top:8px}.month-folder h3{margin:8px 0 2px;color:#123b63}.month-folder p{margin:0;color:#667085;font-size:13px}
@media(max-width:900px){.month-folders{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.month-folders{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
<div class="brand"><img class="logo" src="image.jpg" alt="Government Railway Police emblem"><div><h1>GRP TRICHY RAILWAYS</h1><p>Government Railway Police</p></div></div>
<a class="back" href="index.html">Back</a>
</header>
<main>
<div class="title"><h2>Monthly Review</h2><p>Select a month folder to view that month's review.</p></div>
<div class="month-folders">
<button class="month-folder" onclick="openMonth('January')"><div class="folder-tab"></div><div class="folder-icon">📁</div><h3>January</h3><p>Open folder</p></button>
<button class="month-folder" onclick="openMonth('February')"><div class="folder-tab"></div><div class="folder-icon">📁</div><h3>February</h3><p>Open folder</p></button>
<button class="month-folder" onclick="openMonth('March')"><div class="folder-tab"></div><div class="folder-icon">📁</div><h3>March</h3><p>Open folder</p></button>
<button class="month-folder" onclick="openMonth('April')"><div class="folder-tab"></div><div class="folder-icon">📁</div><h3>April</h3><p>Open folder</p></button>
<button class="month-folder" onclick="openMonth('May')"><div class="folder-tab"></div><div class="folder-icon">📁</div><h3>May</h3><p>Open folder</p></button>
<button class="month-folder" onclick="openMonth('June')"><div class="folder-tab"></div><div class="folder-icon">📁</div><h3>June</h3><p>Open folder</p></button>
<button class="month-folder" onclick="openMonth('July')"><div class="folder-tab"></div><div class="folder-icon">📁</div><h3>July</h3><p>Open folder</p></button>
<button class="month-folder" onclick="openMonth('August')"><div class="folder-tab"></div><div class="folder-icon">📁</div><h3>August</h3><p>Open folder</p></button>
<button class="month-folder" onclick="openMonth('September')"><div class="folder-tab"></div><div class="folder-icon">📁</div><h3>September</h3><p>Open folder</p></button>
<button class="month-folder" onclick="openMonth('October')"><div class="folder-tab"></div><div class="folder-icon">📁</div><h3>October</h3><p>Open folder</p></button>
<button class="month-folder" onclick="openMonth('November')"><div class="folder-tab"></div><div class="folder-icon">📁</div><h3>November</h3><p>Open folder</p></button>
<button class="month-folder" onclick="openMonth('December')"><div class="folder-tab"></div><div class="folder-icon">📁</div><h3>December</h3><p>Open folder</p></button>
</div>
</main>
<script>
function openMonth(month){if(month==='September'){window.location.href='september-review.html';}}
</script>
</body>
</html>
