<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily DSR | GRP Trichy Railways</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#17202a;font-family:Arial,"Noto Sans Tamil",sans-serif}
.page{width:100%;height:100vh;padding:4px 8px 6px;display:flex;flex-direction:column}
h1{margin:0 0 1px;color:#123b63;font-size:21px;text-align:center}
.date{margin:0 0 3px;text-align:center;color:#123b63;font-size:16px;font-weight:700}
.toolbar{display:flex;justify-content:center;gap:8px;margin-bottom:3px}
.btn{display:inline-block;padding:4px 10px;border-radius:5px;text-decoration:none;font-weight:700;font-size:12px}
.download{background:#f2b632;color:#17202a}.back{background:#fff;color:#123b63;border:1px solid #123b63}.quick{background:#123b63;color:#fff;border:1px solid #123b63}.quick:hover{background:#1c527f}
.data-box{width:100%;flex:1;min-height:0;overflow:auto;background:#fff;scrollbar-width:auto;scrollbar-color:#123b63 #e8eef5}
.data-box::-webkit-scrollbar{width:14px;height:14px}.data-box::-webkit-scrollbar-track{background:#e8eef5}.data-box::-webkit-scrollbar-thumb{background:#123b63;border-radius:8px;border:2px solid #e8eef5}
table{border-collapse:collapse;table-layout:fixed;width:100%;min-width:1800px}
th,td{border:1px solid #cbd5e1;padding:2px;vertical-align:middle;line-height:1.18;font-size:13px;overflow-wrap:anywhere;word-break:break-word;text-align:center}
th{background:#123b63;color:#fff;font-weight:700}td{background:#fff}
tbody tr{height:24px}
.total-count-row td{background:#fff2a8;color:red;font-weight:700;font-size:17px}
.status{text-align:center;padding:12px;color:#667085;font-size:12px}
</style>
</head>
<body>
<main class="page">
<h1>Daily DSR</h1>
<div class="date" id="todayDate"></div>
<div class="toolbar">
<a class="btn quick" href="#" onclick="showSheet('0','e-Sakshya');return false">e-Sakshya</a>
<a class="btn quick" href="#" onclick="showSheet('1075382799','e-Summon');return false">e-Summon</a>
<a class="btn quick" href="#" onclick="showSheet('1313629243','SKA October 2026');return false">SKA October 2026</a>
<a class="btn quick" href="#" onclick="return false">Online Complaint</a>
<a class="btn download" href="#" onclick="window.open('https://docs.google.com/spreadsheets/d/'+sheetId+'/export?format=pdf&gid='+currentGid,'_blank');return false" target="_blank">Download PDF</a>
<a class="btn back" href="index.html">Back</a>
</div>
<div class="data-box" id="dataBox"><div class="status">Loading connected Google Spreadsheet...</div></div>
</main>
<script>
const sheetId='1IUqf6_cN2KsbyIhVoAlp_or2mBDCSZM8bQcY8Gu4r2g';
let currentGid='0';
const d=new Date();
document.getElementById('todayDate').textContent=d.toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});
function parseCSV(text){
 const rows=[];let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];
  if(c==='"'){if(quoted&&n==='"'){cell+='"';i++;}else quoted=!quoted;}
  else if(c===','&&!quoted){row.push(cell);cell='';}
  else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(v=>v!==''))rows.push(row);row=[];}
  else cell+=c;
 }
 if(cell!==''||row.length){row.push(cell);if(row.some(v=>v!==''))rows.push(row);}
 return rows;
}
function showSheet(gid,name){
 currentGid=gid;
 document.querySelector('h1').textContent=name;
 document.getElementById('dataBox').innerHTML='<div class="status">Loading '+name+'...</div>';
 const csvUrl='https://docs.google.com/spreadsheets/d/'+sheetId+'/gviz/tq?tqx=out:csv&gid='+gid;
 fetch(csvUrl).then(r=>r.text()).then(text=>{
 const rows=parseCSV(text);
 if(!rows.length)throw new Error('No data');
 const headers=rows[0], data=rows.slice(1);
 const table=document.createElement('table');
 const thead=document.createElement('thead'),hr=document.createElement('tr');
 headers.forEach(v=>{const th=document.createElement('th');th.textContent=v;hr.appendChild(th)});
 thead.appendChild(hr);table.appendChild(thead);
 const tbody=document.createElement('tbody');
 data.forEach(row=>{
  const tr=document.createElement('tr');
  for(let i=0;i<headers.length;i++){const td=document.createElement('td');td.textContent=row[i]||'';tr.appendChild(td)}
  if(row.some(v=>String(v).trim().toLowerCase().includes('total count')))tr.classList.add('total-count-row');
  tbody.appendChild(tr);
 });
 table.appendChild(tbody);
 const box=document.getElementById('dataBox');box.innerHTML='';box.appendChild(table);
}).catch(()=>{document.getElementById('dataBox').innerHTML='<div class="status">Unable to load the connected Google Spreadsheet. Please check that the sheet is shared for viewing.</div>'});
}
showSheet('0','Daily DSR');
</script>
</body>
</html>
